apiVersion: v1
kind: Pod
metadata:
  name: nginx-debug-pod
  labels:
    app: nginx-debug-demo
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80
      startupProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - "rm -f /bin/bash || true"
        initialDelaySeconds: 1
        periodSeconds: 5
        failureThreshold: 30
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - "ls /tmp/app.log"
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-debug-svc
  labels:
    app: nginx-debug-demo
spec:
  selector:
    app: nginx-debug-demo
  ports:
    - protocol: TCP
      port: 80       # Service port
      targetPort: 80 # Container port
  type: ClusterIP

