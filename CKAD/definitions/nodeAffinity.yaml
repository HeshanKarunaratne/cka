apiVersion: v1
kind: Pod
metadata:
  name: nodeAffinity
spec:
  containers:
    - name: nginx
      image: nginx:1.12
      imagePullPolicy: IfNotPresent
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: disktype
                operator: In
                values:
                  - ssd