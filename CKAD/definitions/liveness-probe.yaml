apiVersion: v1
kind: Pod
metadata:
  name: liveness-probe
  labels:
    app: myapp
spec:
  containers:
    - name: nginx
      image: nginx:1.12
      ports:
        - containerPort: 80
      livenessProbe:
        httpGet:
          path: /api/ready
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 5
        failureThreshold: 8