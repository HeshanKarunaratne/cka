apiVersion: v1
kind: Pod
metadata:
  name: resource-requests-and-limits
spec:
  containers:
    - name: nginx
      image: nginx:1.12
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: "1Gi"
          cpu: 1
        limits:
          memory: "2Gi"
          cpu: 2