apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - nginx-deployment.yaml

patches:
  - target:
      kind: Deployment
      name: nginx-deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0
        value:
          name: nginx1
          image: nginx
      
      - op: add
        path: /spec/template/spec/containers/1
        value:
          name: busybox1
          image: busybox